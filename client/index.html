<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#15183A" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0C1A" media="(prefers-color-scheme: dark)" />
    <title>Session — запис на консультації</title>
    <script>
      // Колірна схема до завантаження React, щоб сторінка не «блимала» світлим фоном.
      // Ключ і значення збігаються з налаштуваннями ThemeProvider (src/theme.js).
      (function () {
        try {
          var mode = localStorage.getItem('session.theme') || 'system';
          if (mode === 'system') {
            mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.classList.add(mode === 'dark' ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
