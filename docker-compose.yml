# Локальна база даних PostgreSQL для розробки Session.
# Запуск: у PyCharm кнопка ▶ біля "services:" або вікно Services → Docker.
# Значення змінних беруться з файлу .env у корені проєкту.
services:
  db:
    image: postgres:16-alpine
    container_name: session-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Задайте POSTGRES_USER у .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD у .env}
      POSTGRES_DB: ${POSTGRES_DB:?Задайте POSTGRES_DB у .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - session-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  session-pgdata:
